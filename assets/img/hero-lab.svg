<svg viewBox="0 0 600 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroLabTitle">
  <title id="heroLabTitle">Ilustracija laboratorijske opreme — mikroskop i epruvete</title>

  <!-- Pozadinski "blob" -->
  <path d="M300,60 C390,58 470,110 495,195 C520,280 495,375 425,430 C355,485 255,495 175,455 C95,415 55,325 70,235 C85,145 210,62 300,60 Z" fill="url(#blobGradient)"/>

  <!-- Tačkasti ukras gore levo -->
  <g fill="#0e7c86" opacity="0.18">
    <circle cx="95" cy="90" r="5"/>
    <circle cx="120" cy="75" r="5"/>
    <circle cx="145" cy="90" r="5"/>
    <circle cx="95" cy="115" r="5"/>
    <circle cx="120" cy="100" r="5"/>
    <circle cx="145" cy="115" r="5"/>
  </g>

  <!-- DNK heliks gore desno -->
  <g stroke="#1e3a8a" stroke-width="4" stroke-linecap="round" opacity="0.35">
    <path d="M500,70 C520,90 480,110 500,130 C520,150 480,170 500,190"/>
    <path d="M472,70 C452,90 492,110 472,130 C452,150 492,170 472,190"/>
    <line x1="472" y1="76" x2="500" y2="76"/>
    <line x1="479" y1="100" x2="493" y2="100"/>
    <line x1="472" y1="124" x2="500" y2="124"/>
    <line x1="479" y1="148" x2="493" y2="148"/>
    <line x1="472" y1="172" x2="500" y2="172"/>
  </g>

  <!-- Sto -->
  <rect x="70" y="440" width="440" height="18" rx="9" fill="#085a63"/>
  <rect x="90" y="458" width="400" height="44" rx="6" fill="#e5f5f5"/>

  <!-- Senka -->
  <ellipse cx="300" cy="500" rx="190" ry="14" fill="#0e7c86" opacity="0.08"/>

  <!-- Epruvete u stalku (levo) -->
  <g>
    <rect x="118" y="392" width="86" height="16" rx="6" fill="#085a63"/>
    <circle cx="138" cy="400" r="7" fill="#f2fafa"/>
    <circle cx="163" cy="400" r="7" fill="#f2fafa"/>
    <circle cx="188" cy="400" r="7" fill="#f2fafa"/>

    <rect x="131" y="330" width="14" height="70" rx="7" fill="#ffffff" stroke="#c3dcda" stroke-width="2"/>
    <rect x="133" y="360" width="10" height="38" rx="5" fill="#ff8a5c"/>

    <rect x="156" y="315" width="14" height="85" rx="7" fill="#ffffff" stroke="#c3dcda" stroke-width="2"/>
    <rect x="158" y="350" width="10" height="53" rx="5" fill="#17a3a0"/>

    <rect x="181" y="340" width="14" height="60" rx="7" fill="#ffffff" stroke="#c3dcda" stroke-width="2"/>
    <rect x="183" y="365" width="10" height="33" rx="5" fill="#3552c4"/>
  </g>

  <!-- Mikroskop (desno, glavni element) -->
  <g>
    <!-- baza -->
    <rect x="330" y="418" width="140" height="16" rx="8" fill="#06424a"/>
    <!-- stub -->
    <rect x="392" y="330" width="16" height="90" rx="8" fill="#0e7c86"/>
    <!-- ruka -->
    <path d="M400,330 C440,330 452,300 452,265" stroke="#0e7c86" stroke-width="18" stroke-linecap="round" fill="none"/>
    <!-- glava/okular -->
    <rect x="440" y="215" width="26" height="58" rx="13" transform="rotate(18 453 244)" fill="#085a63"/>
    <circle cx="443" cy="222" r="10" fill="#085a63"/>
    <!-- stočić za uzorak -->
    <rect x="368" y="378" width="66" height="14" rx="7" fill="#17a3a0"/>
    <circle cx="401" cy="385" r="5" fill="#f2fafa"/>
    <!-- fokus dugmići -->
    <circle cx="392" cy="360" r="7" fill="#ff8a5c"/>
  </g>

  <!-- Plutajući krst (medicinski) gore u sredini -->
  <g transform="translate(290,140)" opacity="0.9">
    <rect x="-16" y="-5" width="32" height="10" rx="4" fill="#ff8a5c"/>
    <rect x="-5" y="-16" width="10" height="32" rx="4" fill="#ff8a5c"/>
  </g>

  <!-- Mehur/kapljica dole desno -->
  <circle cx="470" cy="450" r="10" fill="#ff8a5c" opacity="0.7"/>
  <circle cx="495" cy="470" r="6" fill="#ff8a5c" opacity="0.5"/>

  <defs>
    <linearGradient id="blobGradient" x1="70" y1="60" x2="495" y2="495" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e5f5f5"/>
      <stop offset="1" stop-color="#fff1ea"/>
    </linearGradient>
  </defs>
</svg>
